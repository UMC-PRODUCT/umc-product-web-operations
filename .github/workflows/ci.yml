name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # @umc-product/* 는 GitHub Packages. pnpm이 빈 변수 .npmrc를 무시하므로 job 전체에 둡니다.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@umc-product"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: FSD 경계 위반 래칫 체크
        run: pnpm lint:boundaries

      - name: Build
        run: pnpm build
